        /* PURE BLACK AND WHITE */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            margin: 0;
            padding: 15px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* FADING TEXT */
        .fading-text {
            color: #111111; 
            position: absolute;
            top: 10px;
            left: 10px;
            user-select: text;
            font-size: 12px;
            z-index: 99;
        }

        /* HIDDEN BUTTON */
        .ghost-btn {
            position: absolute;
            top: 0;
            right: 0;
            width: 50px;
            height: 50px;
            opacity: 0; 
            cursor: default;
            z-index: 99;
        }

        #terminal {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .input-line {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .prompt {
            color: #ffffff;
            margin-right: 10px;
        }

        input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px; 
            outline: none;
            flex-grow: 1;
            padding: 0;
            margin: 0;
            caret-color: #ffffff;
            letter-spacing: 2px;
        }

        .glitch-text {
            color: #ffffff;
            animation: glitch 0.2s infinite;
        }

        @keyframes glitch {
            0% { opacity: 1; transform: translate(0); }
            20% { opacity: 0.8; transform: translate(-2px, 2px); }
            40% { opacity: 0.9; transform: translate(-2px, -2px); }
            60% { opacity: 0.8; transform: translate(2px, 2px); }
            80% { opacity: 0.9; transform: translate(2px, -2px); }
            100% { opacity: 1; transform: translate(0); }
        }
    </style>
</head>

        const ENCODED_PASS = "gur_ba1_JU7_y8rf_v3_n_o5q_zb4gu"; 

        function rot13(str) {
            return str.replace(/[a-zA-Z]/g, function(c) {
                return String.fromCharCode((c <= "Z" ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26);
            });
        }

        function print(text, className = "") {
            let div = document.createElement('div');
            div.className = className;
            div.innerText = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;

        // GLITCH INPUT EFFECT

            for (let i = 0; i < actualValue.length; i++) {
                if (Math.random() > 0.7) {
                    scrambled += Math.random() > 0.5 ? "█" : "▓";
                } else {
                    scrambled += actualValue[i];
                }
            }
            
            input.value = scrambled;
            setTimeout(() => { input.value = actualValue; }, 40);
        });
